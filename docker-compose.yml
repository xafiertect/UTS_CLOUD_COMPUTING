services:

  web-server:
    image: nginx:alpine
    container_name: web-server
    ports:
      - "80:80"
    mem_limit: 256m
    cpus: "0.5"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs:/app/logs
    networks:
      - frontend-net
    depends_on:
      - api-engine
    restart: unless-stopped

  api-engine:
    build: ./api
    container_name: api-engine
    mem_limit: 512m
    cpus: "1.0"
    expose:
      - "3000"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASS: ${MYSQL_PASSWORD}
    volumes:
      - ./logs:/app/logs
    networks:
      - frontend-net
      - backend-net
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  database:
    image: mysql:8.0
    container_name: database
    mem_limit: 1g
    cpus: "1.5"
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mysql-data:
    driver: local

networks:
  frontend-net:
    driver: bridge
    name: frontend-net
  backend-net:
    driver: bridge
    name: backend-net
    internal: true